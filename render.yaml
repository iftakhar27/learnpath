# Render Blueprint: a staging deployment of the LearnPath API with a PostgreSQL database.
# In the Render dashboard choose New > Blueprint, pick this repository and the branch below.
# Step-by-step guide: docs/10-deploy-render.md
#
# Staging uses the sample content, a simulated payment gateway and OTP codes written to the logs.
# Do NOT use it for real students or payments; production needs Razorpay keys, an SMS provider and Otp__Provider.
databases:
  - name: learnpath-db
    plan: free                # free databases expire after 30 days; switch to basic-256mb to keep data
    region: singapore
    databaseName: learnpath
    user: learnpath
    postgresMajorVersion: "16"

services:
  - type: web
    name: learnpath-api
    runtime: docker
    plan: free                # free instances sleep after ~15 idle minutes; 'starter' stays on
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:                # only API changes redeploy it (web/, mobile/ and docs/ don't)
      paths:
        - src/**
        - Dockerfile
        - .dockerignore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: PORT                                   # the container listens on 8080
        value: "8080"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED    # trust Render's proxy for the original scheme (https)
        value: "true"
      - key: ClientIp__Header                       # Render's edge sets (and overwrites) this with the visitor's address
        value: True-Client-IP
      - key: Bff__SharedKey                         # lets the web server pass on its visitors' addresses (copied below)
        generateValue: true
      - key: ConnectionStrings__Default
        fromDatabase:
          name: learnpath-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      - key: Seed__AdminEmail                       # you are asked for this when creating the Blueprint
        sync: false
      - key: Seed__AdminPassword                    # generated; read it under the service's Environment tab
        generateValue: true
      - key: Seed__SampleContent
        value: "true"
      - key: Razorpay__UseFakeGateway
        value: "true"
      - key: Razorpay__KeySecret
        generateValue: true
      - key: Razorpay__WebhookSecret
        generateValue: true
      - key: Otp__Provider
        value: log
      - key: Branding__ProductName
        value: LearnPath

  # Admin web portal (Next.js). Its server calls the API, so tokens stay in httpOnly cookies and no CORS is needed.
  - type: web
    name: learnpath-admin
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: web              # only changes under web/ redeploy it
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_BASE_URL                           # the API service's URL, e.g. https://learnpath-api-xxxx.onrender.com
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: BFF_SHARED_KEY                         # same value as the API's Bff__SharedKey
        fromService:
          type: web
          name: learnpath-api
          envVarKey: Bff__SharedKey
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: NEXT_PUBLIC_BRAND_NAME
        value: LearnPath
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
