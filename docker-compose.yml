# Local development stack: PostgreSQL + API with sample content and fake payments.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=learnpath;Username=postgres;Password=postgres
    ports: ["8080:8080"]
volumes:
  pgdata:
