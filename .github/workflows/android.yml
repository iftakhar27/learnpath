# Builds the Android app on every push to main that touches the app (or on demand: Actions → Android build → Run
# workflow). The APK is a workflow artifact, downloadable by signed-in users from the run's page:
#   - LearnPath-android-apk: app-release.apk for installing on a phone (signed with the runner's debug key, so an
#     installed copy from a different build may need uninstalling first)
name: Android build

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The API the app talks to (override with a repository variable).
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://learnpath-api-89zs.onrender.com' }}
      # The student website, where "Buy on website" sends students to pay.
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://learnpath-admin.onrender.com' }}
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Build the APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WEB_BASE_URL="$WEB_BASE_URL"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnPath-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
